<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SatQuery AI</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --line: #262d36; --ink: #e6edf3;
    --dim: #8b949e; --accent: #58a6ff; --good: #3fb950; --warn: #d29922;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.55 ui-sans-serif, system-ui, "Segoe UI", sans-serif; }
  header { padding: 22px 28px; border-bottom: 1px solid var(--line); }
  h1 { margin: 0; font-size: 20px; letter-spacing: -.01em; }
  h1 span { color: var(--dim); font-weight: 400; font-size: 14px; margin-left: 10px; }
  main { display: grid; grid-template-columns: 380px 1fr; gap: 0; min-height: calc(100vh - 67px); }
  #left { padding: 24px 28px; border-right: 1px solid var(--line); }
  #right { padding: 24px 28px; }
  label { display: block; font-size: 12px; text-transform: uppercase;
          letter-spacing: .06em; color: var(--dim); margin: 18px 0 6px; }
  input[type=file], select, textarea, button {
    width: 100%; background: var(--panel); color: var(--ink);
    border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px;
    font: inherit; font-size: 14px;
  }
  textarea { min-height: 76px; resize: vertical; }
  button { margin-top: 20px; background: var(--accent); color: #04121f;
           font-weight: 600; border: 0; cursor: pointer; padding: 11px; }
  button:disabled { opacity: .5; cursor: progress; }
  .row { display: grid; grid-template-columns: 1fr 110px; gap: 8px; align-items: end; }
  .examples { margin-top: 22px; font-size: 13px; color: var(--dim); }
  .examples b { color: var(--ink); font-weight: 600; display: block; margin-bottom: 6px; }
  .examples button { all: unset; display: block; color: var(--accent); cursor: pointer;
                     padding: 3px 0; }
  .card { background: var(--panel); border: 1px solid var(--line);
          border-radius: 10px; padding: 18px 20px; margin-bottom: 16px; }
  .meta { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .pill { font-size: 12px; padding: 3px 10px; border-radius: 999px;
          border: 1px solid var(--line); color: var(--dim); }
  .pill b { color: var(--ink); font-weight: 600; }
  .answer { font-size: 17px; line-height: 1.6; }
  .bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden;
         margin: 10px 0 6px; }
  .bar i { display: block; height: 100%; background: var(--good); }
  ol { padding-left: 20px; margin: 0; }
  ol li { margin-bottom: 10px; }
  code { background: #0b0f14; padding: 1px 6px; border-radius: 4px;
         font-size: 12.5px; color: var(--accent); }
  .trace-out { color: var(--dim); font-size: 13.5px; }
  .shots { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
  .shots figure { margin: 0; }
  .shots img { width: 100%; border-radius: 8px; border: 1px solid var(--line); display: block; }
  .shots figcaption { font-size: 12px; color: var(--dim); margin-top: 6px; }
  a.dl { display: inline-block; margin-top: 4px; color: var(--accent); }
  .err { border-color: #8b2c2c; color: #ffa198; }
  .muted { color: var(--dim); }
</style>
</head>
<body>
<header>
  <h1>SatQuery AI <span id="health">checking backend…</span></h1>
</header>

<main>
  <section id="left">
    <form id="form">
      <label for="image1">Image 1 (required)</label>
      <div class="row">
        <input id="image1" name="image1" type="file" accept=".png,.jpg,.jpeg,.tif,.tiff" required>
        <select id="image1_modality" name="image1_modality">
          <option value="auto">auto</option><option value="optical">optical</option><option value="sar">SAR</option>
        </select>
      </div>

      <label for="image2">Image 2 (optional — second date, or the SAR view)</label>
      <div class="row">
        <input id="image2" name="image2" type="file" accept=".png,.jpg,.jpeg,.tif,.tiff">
        <select id="image2_modality" name="image2_modality">
          <option value="auto">auto</option><option value="optical">optical</option><option value="sar">SAR</option>
        </select>
      </div>

      <label for="resolution_m">Ground resolution (optional, metres per pixel)</label>
      <input id="resolution_m" name="resolution_m" type="number" step="any" min="0"
             placeholder="e.g. 0.5 — needed for areas in hectares">

      <label for="query">Query</label>
      <textarea id="query" name="query" required
                placeholder="What changed between these two dates?"></textarea>

      <button type="submit" id="go">Analyze</button>
    </form>

    <div class="examples">
      <b>Try</b>
      <button type="button" data-q="What changed between these two dates?">change detection (2 images)</button>
      <button type="button" data-q="Describe this scene.">captioning (1 image)</button>
      <button type="button" data-q="What kind of land cover is visible?">visual question answering</button>
      <button type="button" data-q="How much of this scene is trees, and how much is water?">land-cover area</button>
      <button type="button" data-q="Highlight the buildings">grounding</button>
      <button type="button" data-q="Is there open water in this scene?">optical + SAR fusion</button>
    </div>
  </section>

  <section id="right">
    <div class="card muted" id="placeholder">
      Upload an image and ask a question. The agent picks one of six tools,
      runs it, and shows you which one it chose and why.
    </div>
    <div id="results"></div>
  </section>
</main>

<script>
const API = location.origin;
const $ = (s) => document.querySelector(s);

fetch(API + "/api/health").then(r => r.json()).then(h => {
  const brains = Object.entries(h.providers_ok).filter(([, ok]) => ok).map(([n]) => n);
  $("#health").textContent =
    `${h.gpu_available ? h.gpu_name : "CPU only"} · brains: ${brains.join(", ") || "none"}` +
    `${h.lora_adapter_loaded ? " · LoRA adapter loaded" : ""}`;
}).catch(() => { $("#health").textContent = "backend unreachable"; });

document.querySelectorAll(".examples button").forEach(b =>
  b.onclick = () => { $("#query").value = b.dataset.q; });

$("#form").onsubmit = async (e) => {
  e.preventDefault();
  $("#go").disabled = true;
  $("#placeholder").remove?.();
  $("#results").innerHTML = `<div class="card muted">Analyzing…</div>`;
  try {
    const res = await fetch(API + "/api/analyze", { method: "POST", body: new FormData(e.target) });
    const body = await res.json();
    if (!res.ok) throw new Error(body.detail || res.statusText);
    render(body);
  } catch (err) {
    $("#results").innerHTML = `<div class="card err"><b>Rejected:</b> ${escapeHtml(err.message)}</div>`;
  } finally {
    $("#go").disabled = false;
  }
};

function overlayCaption(tool) {
  if (tool === "run_land_cover") return "Green vegetation · blue water · red built-up or bare";
  if (tool === "run_fusion_analysis") return "Where optical and SAR agree: green, blue, red";
  if (tool === "run_grounding") return "Matched regions";
  return "Detected change, on the later image";
}

function render(r) {
  const ev = r.visual_evidence || {};
  const shots = [
    [ev.overlay_png_url, overlayCaption(r.task_classified)],
    [ev.change_mask_url, "Binary change mask"],
  ].filter(([u]) => u);

  $("#results").innerHTML = `
    <div class="card">
      <div class="meta">
        <span class="pill">tool <b>${r.task_classified ?? "—"}</b></span>
        <span class="pill">brain <b>${r.llm_provider ?? "—"}</b></span>
        <span class="pill">time <b>${r.elapsed_seconds}s</b></span>
        <span class="pill">job <b>${r.job_id}</b></span>
      </div>
      <div class="answer">${escapeHtml(r.answer ?? "")}</div>
      <div class="bar"><i style="width:${Math.round(r.confidence * 100)}%"></i></div>
      <div class="muted" style="font-size:13px">
        confidence ${r.confidence}${r.confidence_reasons?.length
          ? " — " + r.confidence_reasons.map(escapeHtml).join("; ") : ""}
      </div>
      <a class="dl" href="${API + r.report_url}" target="_blank">Download PDF report ↓</a>
    </div>

    <div class="card">
      <b>Execution trace</b>
      <ol style="margin-top:12px">
        ${(r.execution_trace || []).map(s => `
          <li><code>${escapeHtml(s.tool)}</code>
            <span class="muted">${escapeHtml(JSON.stringify(s.parameters))}</span>
            <div class="trace-out">${escapeHtml(s.output_summary)}</div></li>`).join("")}
      </ol>
    </div>

    ${shots.length ? `<div class="card"><b>Visual evidence</b>
      <div class="shots" style="margin-top:12px">
        ${shots.map(([u, c]) => `<figure><img src="${API + u}" alt="${c}">
          <figcaption>${c}</figcaption></figure>`).join("")}
      </div></div>` : ""}
  `;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
</script>
</body>
</html>
